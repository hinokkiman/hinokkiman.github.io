<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRA — 별이 말하는 오늘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #07091a;
      --navy2:  #0d1030;
      --navy3:  #141840;
      --gold:   #c9a84c;
      --gold2:  #e8cc7a;
      --gold3:  #f5e4a8;
      --white:  #f0eeea;
      --muted:  #7a7fa8;
      --serif:  'Cormorant Garamond', serif;
      --sans:   'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: var(--sans);
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Canvas ── */
    #starfield {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    main { position: relative; z-index: 1; }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 4rem;
      border-bottom: 1px solid rgba(201,168,76,.12);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      background: rgba(7,9,26,.7);
    }
    .logo {
      font-family: var(--serif);
      font-size: 1.6rem; letter-spacing: .18em;
      color: var(--gold2);
      text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 2.4rem; list-style: none; }
    .nav-links a {
      font-size: .8rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
      text-decoration: none; transition: color .25s;
    }
    .nav-links a:hover { color: var(--gold2); }

    /* ── HERO ── */
    .hero {
      min-height: 92vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
    }
    .hero-eyebrow {
      font-size: .75rem; letter-spacing: .25em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 1.6rem;
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 300; line-height: 1.08;
      color: var(--white);
      margin-bottom: 1.4rem;
    }
    .hero h1 em { font-style: italic; color: var(--gold2); }
    .hero-sub {
      font-size: 1rem; color: var(--muted);
      max-width: 480px; line-height: 1.7;
      margin-bottom: 3.5rem;
    }

    /* ── FORM ── */
    .birth-form {
      display: flex; gap: .8rem; flex-wrap: wrap;
      justify-content: center; align-items: center;
    }
    .birth-form input[type="date"] {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(201,168,76,.3);
      border-radius: 8px;
      color: var(--white);
      font-family: var(--sans); font-size: .9rem;
      padding: .75rem 1.2rem;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
      color-scheme: dark;
    }
    .birth-form input[type="date"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,.15);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border: none; border-radius: 8px;
      color: var(--navy); font-family: var(--sans);
      font-size: .85rem; font-weight: 500;
      letter-spacing: .08em;
      padding: .78rem 2rem; cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* ── RESULT CARD ── */
    #result {
      margin: 0 auto 5rem;
      max-width: 680px; padding: 0 2rem;
      display: none;
    }
    .result-card {
      background: linear-gradient(135deg, rgba(20,24,64,.9), rgba(13,16,48,.95));
      border: 1px solid rgba(201,168,76,.22);
      border-radius: 20px;
      padding: 2.8rem 3rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(201,168,76,.1);
    }
    .result-sign-name {
      font-family: var(--serif);
      font-size: 3.2rem; font-weight: 300;
      color: var(--gold2); margin-bottom: .3rem;
    }
    .result-sign-sub {
      font-size: .75rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 2rem;
    }
    .fortune-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-top: 1.4rem;
    }
    .fortune-item {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 12px; padding: 1.1rem 1.3rem;
    }
    .fortune-label {
      font-size: .68rem; letter-spacing: .18em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: .5rem;
    }
    .fortune-stars { font-size: 1rem; margin-bottom: .5rem; }
    .fortune-text { font-size: .82rem; color: rgba(240,238,234,.75); line-height: 1.6; }

    /* ── DIVIDER ── */
    .section-divider {
      text-align: center; padding: 5rem 2rem 2.5rem;
    }
    .section-divider h2 {
      font-family: var(--serif); font-size: clamp(2rem,4vw,3.2rem);
      font-weight: 300; color: var(--white);
    }
    .section-divider p {
      font-size: .85rem; color: var(--muted);
      margin-top: .8rem; letter-spacing: .04em;
    }
    .gold-line {
      width: 48px; height: 1px;
      background: var(--gold); margin: 1.4rem auto 0;
    }

    /* ── ZODIAC GRID ── */
    #zodiac { padding: 0 4rem 8rem; }
    .zodiac-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.4rem; max-width: 1200px; margin: 3rem auto 0;
    }
    .zodiac-card {
      background: rgba(13,16,48,.7);
      border: 1px solid rgba(201,168,76,.12);
      border-radius: 16px; padding: 1.8rem 1.6rem;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    .zodiac-card::before {
      content: '';
      position: absolute; inset: 0; border-radius: 16px;
      background: radial-gradient(circle at 50% 0%, rgba(201,168,76,.08), transparent 70%);
      opacity: 0; transition: opacity .3s;
    }
    .zodiac-card:hover {
      transform: translateY(-4px);
      border-color: rgba(201,168,76,.5);
      box-shadow: 0 0 28px rgba(201,168,76,.12), 0 16px 48px rgba(0,0,0,.4);
    }
    .zodiac-card:hover::before { opacity: 1; }
    .card-symbol {
      font-size: 2.4rem; margin-bottom: .8rem;
      display: block;
    }
    .card-name {
      font-family: var(--serif); font-size: 1.35rem;
      font-weight: 400; color: var(--gold2);
      margin-bottom: .2rem;
    }
    .card-date {
      font-size: .72rem; color: var(--muted);
      letter-spacing: .08em; margin-bottom: .9rem;
    }
    .card-keyword {
      font-size: .78rem; color: rgba(240,238,234,.6);
      line-height: 1.5;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(4,5,18,.82);
      backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
      padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: linear-gradient(160deg, var(--navy3), var(--navy2));
      border: 1px solid rgba(201,168,76,.25);
      border-radius: 24px; max-width: 560px; width: 100%;
      padding: 3rem 3.2rem;
      box-shadow: 0 48px 120px rgba(0,0,0,.6), inset 0 1px 0 rgba(201,168,76,.12);
      position: relative; animation: modalIn .3s cubic-bezier(.22,1,.36,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-close {
      position: absolute; top: 1.4rem; right: 1.6rem;
      background: none; border: none; color: var(--muted);
      font-size: 1.5rem; cursor: pointer; line-height: 1;
      transition: color .2s;
    }
    .modal-close:hover { color: var(--gold2); }
    .modal-symbol { font-size: 3.5rem; margin-bottom: 1rem; }
    .modal-title {
      font-family: var(--serif); font-size: 2.4rem;
      font-weight: 300; color: var(--gold2); margin-bottom: .3rem;
    }
    .modal-sub {
      font-size: .72rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 1.6rem;
    }
    .modal-desc {
      font-size: .9rem; line-height: 1.8;
      color: rgba(240,238,234,.8); margin-bottom: 1.6rem;
    }
    .modal-tags { display: flex; gap: .6rem; flex-wrap: wrap; }
    .modal-tag {
      font-size: .7rem; letter-spacing: .1em;
      text-transform: uppercase;
      border: 1px solid rgba(201,168,76,.3);
      color: var(--gold); border-radius: 20px;
      padding: .3rem .85rem;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 3rem 2rem;
      border-top: 1px solid rgba(255,255,255,.06);
      font-size: .75rem; color: var(--muted); letter-spacing: .08em;
    }
    footer span { color: var(--gold); }

    @media (max-width: 768px) {
      nav { padding: 1.2rem 1.6rem; }
      .nav-links { display: none; }
      #zodiac { padding: 0 1.2rem 5rem; }
      .result-card { padding: 2rem 1.6rem; }
      .fortune-grid { grid-template-columns: 1fr; }
      .modal { padding: 2rem 1.6rem; }
    }
  </style>
</head>

<script>
// ─── STARFIELD ───────────────────────────────────────────
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let W, H, stars = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initStars() {
  stars = [];
  for (let i = 0; i < 240; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + .2,
      alpha: Math.random() * .7 + .15,
      speed: Math.random() * .25 + .05,
      twinkle: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, W, H);
  stars.forEach(s => {
    s.twinkle += s.speed * .018;
    const a = s.alpha * (.7 + .3 * Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240,235,210,${a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

window.addEventListener('resize', () => { resize(); initStars(); });
resize(); initStars(); requestAnimationFrame(drawStars);

    '투자보다는 안정에 집중할 시기입니다. 지금의 것을 지키는 것이 현명합니다.',

  건강: [
    '충분한 수면이 오늘의 키워드입니다. 일찍 자리에 드세요.',

function stars2(n) { return '★'.repeat(n) + '☆'.repeat(5-n); }

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getSign(month, day) {
  const md = month * 100 + day;
  if (md >= 321 && md <= 419) return 0;
  if (md >= 420 && md <= 520) return 1;
  if (md >= 521 && md <= 620) return 2;
  if (md >= 621 && md <= 722) return 3;
  if (md >= 723 && md <= 822) return 4;
  if (md >= 823 && md <= 922) return 5;
  if (md >= 923 && md <= 1022) return 6;
  if (md >= 1023 && md <= 1121) return 7;
  if (md >= 1122 && md <= 1221) return 8;
  if (md >= 1222 || md <= 119) return 9;
  if (md >= 120 && md <= 218) return 10;
  return 11;
}

function getReading() {
  const val = document.getElementById('birthdate').value;
  if (!val) { alert('생년월일을 입력해주세요.'); return; }
  const d = new Date(val);
  const m = d.getMonth() + 1, day = d.getDate();
  const idx = getSign(m, day);
  const sign = SIGNS[idx];

  document.getElementById('res-name').textContent = sign.sym + ' ' + sign.name;
  document.getElementById('res-sub').textContent = sign.en.toUpperCase() + '  ·  ' + sign.date + '  ·  ' + sign.element + '의 별자리';

  const cats = ['연애','금전','건강','총운'];
  const el = document.getElementById('res-fortune');
  el.innerHTML = '';
  cats.forEach(cat => {
    const score = Math.floor(Math.random() * 2) + 3;
    el.innerHTML += `
      <div class="fortune-item">
        <div class="fortune-label">${cat}</div>
        <div class="fortune-stars">${stars2(score)}</div>
        <div class="fortune-text">${pick(FORTUNES[cat])}</div>
      </div>`;
  });

  const res = document.getElementById('result');
  res.style.display = 'block';
  setTimeout(() => res.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
}

// ─── ZODIAC GRID ─────────────────────────────────────────
const grid = document.getElementById('zodiac-grid');
SIGNS.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'zodiac-card';
  card.innerHTML = `
    <span class="card-symbol">${s.sym}</span>
    <div class="card-name">${s.name}</div>
    <div class="card-date">${s.date}</div>
    <div class="card-keyword">${s.element} · ${s.planet}</div>`;
  card.onclick = () => openModal(i);
  grid.appendChild(card);
});

// ─── MODAL ───────────────────────────────────────────────
function openModal(i) {
  const s = SIGNS[i];
  document.getElementById('m-symbol').textContent = s.sym;
  document.getElementById('m-title').textContent = s.name;
  document.getElementById('m-sub').textContent = s.en.toUpperCase() + '  ·  ' + s.date + '  ·  ' + s.element + ' / ' + s.planet;
  document.getElementById('m-desc').textContent = s.desc;
  document.getElementById('m-tags').innerHTML = s.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal') || e.currentTarget.classList.contains('modal-close')) {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
